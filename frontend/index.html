<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E4A2C" />
    <meta name="description" content="AgroBolivia: consulta el clima, planifica tus siembras y mantente conectado con tu comunidad." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>AgroBolivia</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#FAF6EE;color:#1E4A2C;font-family:system-ui,sans-serif;padding:24px;text-align:center">
        <img src="/icon-192.png" alt="" width="72" height="72" style="border-radius:16px" />
        <p style="font-size:24px;font-weight:700;margin:0">PACHA-AGRO</p>
        <p style="font-size:17px;margin:0">Cargando…</p>
        <p id="agb-slow" style="display:none;font-size:15px;max-width:320px;margin:8px 0 0">Está tardando: revise su señal. Si es la primera vez del día, el servidor puede tardar hasta un minuto en despertar.<br /><button onclick="location.reload()" style="margin-top:12px;font-size:16px;padding:10px 20px;border-radius:8px;border:0;background:#1E4A2C;color:#fff">Reintentar</button></p>
      </div>
    </div>
    <script>setTimeout(function () { var s = document.getElementById('agb-slow'); if (s) s.style.display = 'block' }, 10000)</script>
    <noscript>AgroBolivia necesita JavaScript activado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
